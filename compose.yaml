# Fixed project name keeps volume names (database, uploads) stable even if the folder is renamed.
name: hoan-lao-pickleball
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DATA_DIR: /app/data
      TRUST_PROXY: "1"
    volumes:
      - club_data:/app/data
      - club_backups:/app/backups
    # HTTPS is served by the Traefik instance already running on the VPS (ports 80/443,
    # Let's Encrypt resolver "letsencrypt"). No host port is published.
    labels:
      traefik.enable: "true"
      traefik.http.routers.hoan-lao-pickleball.rule: Host(`${DOMAIN}`)
      traefik.http.routers.hoan-lao-pickleball.entrypoints: websecure
      traefik.http.routers.hoan-lao-pickleball.tls.certresolver: letsencrypt
      traefik.http.services.hoan-lao-pickleball.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  club_data:
  club_backups:
